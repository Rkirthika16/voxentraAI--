name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via Render Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set!"
            echo "Please add RENDER_DEPLOY_HOOK_URL in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Triggering Render Deploy Hook..."
          response=$(curl -s -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          http_code="${response: -3}"
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Render deployment triggered successfully (HTTP $http_code)!"
          else
            echo "Deployment trigger failed with HTTP status code: $http_code"
            exit 1
          fi
